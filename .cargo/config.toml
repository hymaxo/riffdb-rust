[env]
# Mirrors the sqlite compile definitions from the original CMakeLists.txt.
# Consumed by libsqlite3-sys (through rusqlite) when building the bundled
# amalgamation.
# -U removes libsqlite3-sys defaults that the C build doesn't have
# (COLUMN_METADATA conflicts with OMIT_DECLTYPE; FOREIGN_KEYS/URI change behaviour).
# SQLITE_OMIT_AUTOINIT is dropped: rusqlite has no safe sqlite3_initialize(),
# so sqlite initialises itself on the first open instead (no visible difference).
LIBSQLITE3_FLAGS = "-USQLITE_ENABLE_COLUMN_METADATA -USQLITE_DEFAULT_FOREIGN_KEYS -USQLITE_USE_URI -DSQLITE_THREADSAFE=1 -DSQLITE_STRICT_SUBTYPE=1 -DSQLITE_OMIT_SHARED_CACHE=1 -DSQLITE_OMIT_PROGRESS_CALLBACK=1 -DSQLITE_OMIT_DEPRECATED=1 -DSQLITE_OMIT_DECLTYPE=1 -DSQLITE_MAX_EXPR_DEPTH=0 -DSQLITE_LIKE_DOESNT_MATCH_BLOBS=1 -DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1 -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_DQS=0"
