[env]
# sqlite compile options, read by libsqlite3-sys (through rusqlite) when it
# builds the bundled amalgamation.
# -U removes libsqlite3-sys defaults we don't want (COLUMN_METADATA conflicts
# with OMIT_DECLTYPE; FOREIGN_KEYS and URI change behaviour).
LIBSQLITE3_FLAGS = "-USQLITE_ENABLE_COLUMN_METADATA -USQLITE_DEFAULT_FOREIGN_KEYS -USQLITE_USE_URI -DSQLITE_THREADSAFE=1 -DSQLITE_STRICT_SUBTYPE=1 -DSQLITE_OMIT_SHARED_CACHE=1 -DSQLITE_OMIT_PROGRESS_CALLBACK=1 -DSQLITE_OMIT_DEPRECATED=1 -DSQLITE_OMIT_DECLTYPE=1 -DSQLITE_MAX_EXPR_DEPTH=0 -DSQLITE_LIKE_DOESNT_MATCH_BLOBS=1 -DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1 -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_DQS=0"
