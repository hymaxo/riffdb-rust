[package]
name = "riffdb"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "SQLite over HTTP: a small, fast database server"

[dependencies]
# Bundled sqlite; its compile flags are set through LIBSQLITE3_FLAGS in
# .cargo/config.toml.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = "1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# event loop
mio = { version = "1", features = ["os-poll", "net"] }
# listening socket options (SO_REUSEADDR / SO_REUSEPORT / backlog)
socket2 = { version = "0.5", features = ["all"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
