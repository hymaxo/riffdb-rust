[package]
name = "riffdb"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Direct (unsafe) Rust port of riffdb - sqlite over http"

[dependencies]
libc = "0.2"
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock", "Win32_Foundation"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
